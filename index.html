<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yayın Test Sayfası</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* MASAÜSTÜ */
        .maske-alani {
            width: 1100px;  
            height: 450px; 
            overflow: hidden; 
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .maske-alani iframe {
            position: absolute;
            top: -300px;  
            left: -50px; 
            width: 1200px; 
            height: 1000px; 
            border: none;
        }

        /* MOBİL */
        @media screen and (max-width: 768px) {
            .maske-alani {
                width: 95vw;
                height: 85vh;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
                position: relative;
                border: 2px solid #333;
            }

            .maske-alani iframe {
                position: absolute;
                top: -230px;
                left: -10px;
                width: 400px;
                height: 1360px;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="maske-alani">
        <iframe src="https://ngscanli147.com" scrolling="no"></iframe>
    </div>

</body>
</html>
